<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password - GradHire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
<div id="toast"></div>
<div class="w-full max-w-md px-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-gray-100 px-8 py-8 text-center border-b border-gray-200">
      <i class="fas fa-key text-[#1E3A8A] text-3xl mb-2"></i>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Change Your Password</h1>
      <p class="text-gray-500 text-sm mt-1">You must set a new password to continue</p>
    </div>
    <div class="px-8 py-8">
      <div id="errBox" class="hidden bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="lblUsername">Current Username</label>
          <input id="curUsr" type="text" class="form-input" disabled />
        </div>
        <div id="newUsrContainer" class="hidden">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">New Username</label>
          <input id="newUsr" type="text" class="form-input" placeholder="Set new username" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Current Password</label>
          <input id="curPwd" type="password" class="form-input" placeholder="Admin@123"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">New Password</label>
          <input id="newPwd" type="password" class="form-input" placeholder="Min 6 characters"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm New Password</label>
          <input id="cfmPwd" type="password" class="form-input" placeholder="Repeat new password"/>
        </div>
        <button onclick="changePassword()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
          <i class="fas fa-check"></i> Set New Password
        </button>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { 
  if (!getToken()) {
    window.location.href='/index.html'; 
    return;
  }
  initTheme(); 
  
  const user = getUser();
  if (user) {
    document.getElementById('curUsr').value = user.username || user.email || '';
    if (user.role === 'STAFF') {
      document.getElementById('newUsrContainer').classList.remove('hidden');
    }
  }
});
async function changePassword() {
  const user = getUser();
  const cp = document.getElementById('curPwd').value;
  const np = document.getElementById('newPwd').value;
  const fp = document.getElementById('cfmPwd').value;
  let nu = null;
  
  if (user.role === 'STAFF') {
    nu = document.getElementById('newUsr').value.trim();
    if (!nu) { showE('New username is required for staff'); return; }
  }
  
  if (!cp||!np||!fp) { showE('Password fields are required'); return; }
  if (np !== fp) { showE('Passwords do not match'); return; }
  
  const strongRegex = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\\$%\\^&\\*])(?=.{8,})");
  if (!strongRegex.test(np)) { 
    showE('Password must be at least 8 characters and include uppercase, lowercase, number, and special character.'); 
    return; 
  }
  
  const data = await apiFetch('/auth/change-password', {
    method:'POST', headers: authHeaders(),
    body: JSON.stringify({ currentPassword: cp, newPassword: np, newUsername: nu })
  });
  if (data && data.success) {
    user.passwordChanged = true; 
    if (nu) user.username = nu;
    localStorage.setItem('user', JSON.stringify(user));
    const r = user.role;
    if (r==='ADMIN') window.location.href='/pages/admin-dashboard.html';
    else if (r==='STAFF') window.location.href='/pages/staff-dashboard.html';
    else window.location.href='/pages/student-dashboard.html';
  } else { showE(data?.message || 'Failed to change password'); }
}
function showE(msg) { const e=document.getElementById('errBox'); e.textContent=msg; e.classList.remove('hidden'); }
</script>
</body>
</html>
