<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - GradHire</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
<div id="toast"></div>
<div class="w-full max-w-md px-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-gray-100 px-8 py-8 text-center border-b border-gray-200">
      <div class="flex items-center justify-center mx-auto mb-4">
        <img src="/images/logo.png" alt="GradHire Logo" class="h-16 w-auto object-contain">
      </div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Register</h1>
      <p class="text-gray-500 text-sm mt-1">Create your GradHire account</p>
    </div>
    <div class="px-8 py-8">
      <div id="errBox" class="hidden bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="successBox" class="hidden bg-green-50 text-green-600 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div class="space-y-4" id="regForm">

        <!-- ROLE SELECTION -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Register as</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" onclick="selectRegRole('STUDENT')" id="regRoleBtn_STUDENT" class="py-2 rounded-lg border-2 border-[#005CB4] text-[#005CB4] bg-blue-50 dark:bg-blue-900/20 font-semibold text-sm transition">Student</button>
            <button type="button" onclick="selectRegRole('STAFF')" id="regRoleBtn_STAFF" class="py-2 rounded-lg border-2 border-gray-200 dark:border-gray-600 text-gray-500 dark:text-gray-400 font-semibold text-sm transition hover:border-[#005CB4] hover:text-[#005CB4]">Staff</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
          <input id="fullName" type="text" class="form-input" placeholder="Enter your full name" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email <span class="text-xs text-gray-400">(Optional)</span></label>
          <input id="email" type="email" class="form-input" placeholder="Enter your email" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="usernameLabel">Username / Register Number</label>
          <input id="username" type="text" class="form-input" placeholder="Enter your reg no." />
        </div>
        <div id="deptField" class="hidden">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Department</label>
          <input id="department" type="text" class="form-input" placeholder="e.g. Computer Science" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
          <input id="password" type="password" class="form-input" placeholder="Min 8 chars, 1 uppercase, 1 special char" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm Password</label>
          <input id="confirmPassword" type="password" class="form-input" placeholder="Repeat password" />
        </div>
        <button id="regBtn" onclick="doRegister()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
          <i id="spinner" class="fas fa-spinner fa-spin hidden"></i> <span id="btnText">Sign Up</span>
        </button>
      </div>
      <div class="text-center mt-4">
        <a href="/index.html" class="text-sm font-medium text-[#005CB4] hover:text-[#004494] dark:text-blue-400 dark:hover:text-blue-300">Already have an account? Login here</a>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  let regRole = 'STUDENT';

  function selectRegRole(role) {
    regRole = role;
    ['STUDENT','STAFF'].forEach(r => {
      const btn = document.getElementById('regRoleBtn_' + r);
      if (r === role) {
        btn.classList.add('border-[#005CB4]','text-[#005CB4]','bg-blue-50','dark:bg-blue-900/20');
        btn.classList.remove('border-gray-200','text-gray-500','dark:border-gray-600','dark:text-gray-400');
      } else {
        btn.classList.remove('border-[#005CB4]','text-[#005CB4]','bg-blue-50','dark:bg-blue-900/20');
        btn.classList.add('border-gray-200','text-gray-500','dark:border-gray-600','dark:text-gray-400');
      }
    });
    // Show/hide staff-specific fields
    document.getElementById('deptField').classList.toggle('hidden', role !== 'STAFF');
    document.getElementById('usernameLabel').textContent = role === 'STAFF' ? 'Username' : 'Username / Register Number';
  }

  async function doRegister() {
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const department = document.getElementById('department')?.value?.trim() || '';

    if (!fullName || !username || !password || !confirmPassword) {
      showE('All fields except email are required'); return;
    }
    if (email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) { showE('Please enter a valid email address'); return; }
    }
    if (password !== confirmPassword) { showE('Passwords do not match'); return; }
    const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\$%\^&\*])(?=.{8,})/;
    if (!strongRegex.test(password)) {
      showE('Password must be at least 8 characters and include uppercase, lowercase, number, and special character.');
      return;
    }

    const btn = document.getElementById('regBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = true; spinner.classList.remove('hidden'); btnText.textContent = 'Registering...';
    document.getElementById('errBox').classList.add('hidden');

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, email, username, password, role: regRole, department })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('regForm').classList.add('hidden');
        document.getElementById('successBox').textContent = data.message || 'Registration successful! You can now login.';
        document.getElementById('successBox').classList.remove('hidden');
      } else {
        showE(data.message || 'Registration failed');
      }
    } catch (e) {
      showE('Server error. Is the backend running?');
    } finally {
      btn.disabled = false; spinner.classList.add('hidden'); btnText.textContent = 'Sign Up';
    }
  }

  function showE(msg) {
    const e = document.getElementById('errBox');
    e.textContent = msg;
    e.classList.remove('hidden');
    document.getElementById('successBox').classList.add('hidden');
  }
</script>
</body>
</html>
